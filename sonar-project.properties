# ─────────────────────────────────────────────────────────────────────────────
# Remuxarr — SonarQube analysis configuration
#
# NOTE ON PROJECT IDENTITY: sonar.projectKey / sonar.organization are
# deliberately NOT set here, because they are environment-specific and a wrong
# value breaks analysis. If your scanner invocation already passes them (via
# -D flags, CI secrets, or the SonarCloud UI), leave this as-is. Add them here
# only if your current setup expects to read them from this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# DISABLED RULES
#
# Each rule below was audited against the actual source before being disabled,
# not silenced for convenience. Rationale is inline so the decision can be
# re-litigated later with the reasoning attached rather than rediscovered.
#
# Combined, these account for 168 of the 322 findings (52%). The point is not
# a smaller number — it is that the remaining findings are ones worth reading,
# so a genuine regression is visible instead of buried.
#
# NOT disabled, and deliberately so: S3776 (cognitive complexity), S6903
# (utcnow), S7502/S7497 (asyncio patterns). Those are real signals that are
# either scheduled work or need case-by-case judgement.
# ─────────────────────────────────────────────────────────────────────────────

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9

# ── e1 · python:S8410 — "use Annotated[] for FastAPI dependencies" (60) ──────
# `db: Session = Depends(get_db)` vs `db: Annotated[Session, Depends(get_db)]`.
# Both are fully supported FastAPI and behave identically; Annotated is the
# style current docs prefer. This is a house-style preference, not a
# correctness, security or performance issue. Applying it means rewriting 60
# route signatures across every router for a zero-behaviour diff, with real
# merge-conflict cost and a real chance of a typo in a signature that works
# today. Adopt opportunistically when touching a file if wanted — never as a
# sweep.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S8410
sonar.issue.ignore.multicriteria.e1.resourceKey=app/api/routes/**/*.py

# ── e2 · python:S8415 — "document HTTPException in responses={}" (44) ────────
# Wants every `raise HTTPException(404, ...)` mirrored in an explicit
# responses={} dict on the decorator. FastAPI already emits 4xx/5xx entries
# into the OpenAPI schema, and the only consumer of this API is this repo's
# own React frontend — there is no third-party contract these docs serve. The
# suggested fix is 44 hand-maintained dicts that drift from the raises they
# describe the first time an error path changes.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.e2.resourceKey=app/api/routes/**/*.py

# ── e3 · javascript:S3358 — nested ternaries (45) ────────────────────────────
# Scoped to all of frontend/src, not just *.jsx: 39 findings are in JSX
# interpolation, but 6 are in hooks (useAppData.js, useActions.js) and sit in
# exactly the same expression-only position — arguments to toast(), where the
# ternary selects a pluralised message or a tone name. Neither JSX `{}` nor a
# call argument accepts an `if` statement, so the rule's suggested fix is to
# hoist each one into a `let` above the return. That is 45 new intermediate
# variables and a return block detached from the logic that populates it:
# measurably harder to read, which is the opposite of the rule's intent.
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e3.resourceKey=frontend/src/**/*

# ── e4 · javascript:S6770 — "component names must be PascalCase" (10) ────────
# Fires only on <LED>. LED is an acronym, and React's actual requirement is an
# initial capital, which it satisfies — this is a naming heuristic, not a
# framework rule. Renaming a well-named atom to `Led` across 10 call sites is
# churn with negative readability value.
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S6770
sonar.issue.ignore.multicriteria.e4.resourceKey=frontend/src/**/*.jsx

# ── e5 · python:S1192 — duplicated string literals (9) ───────────────────────
# Covers app/ generally, not just routes: the findings span routes,
# database/models.py and core/subprocess_runner.py. Extracting
# HISTORY_ITEM_NOT_FOUND so it can be used three times makes the error harder
# to read at the raise site, and "all, delete-orphan" is SQLAlchemy's own
# cascade spec — a constant for it is pure indirection over a value the ORM
# defines.
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e5.resourceKey=app/**/*.py

# ── e6–e9 · overlay/row accessibility (18) ──────────────────────────────────
# S1082, S6847, S6848, S6819 on the click-to-dismiss backdrops, the mobile
# drawer scrim, and two selectable list rows.
#
# Every one of the 18 was checked individually against the source, not
# generalised from one example. Each flagged element has a real keyboard path
# that Sonar's per-element analysis cannot see:
#
#   DetailModal.jsx / App.jsx / AppHeader.jsx — window-level keydown handlers
#     close on Escape (DetailModal.jsx:42, AppHeader.jsx:104), alongside
#     role="dialog", aria-modal and an accessible name. Escape IS the keyboard
#     affordance for dismissing an overlay.
#   QueuePanel.jsx:78 — the row onClick is a mouse convenience; the focusable
#     control is the filename button, as the comment above it states.
#   MaintenanceSection.jsx:616 — the row contains a real <input type=checkbox>,
#     so the toggle is tab- and space-reachable.
#   AppHeader.jsx:344 — role="status" on a live-region wrapper. S6819 wants
#     <output>, which is for form calculation results and is semantically
#     wrong for a connection indicator.
#
# S6819's other suggestion, native <dialog>, brings its own top-layer and
# backdrop behaviour that conflicts with the mobile full-screen sheet layout.
#
# SCOPE NOTE, stated deliberately: SonarQube's exclusion matcher supports only
# * / ** / ? — it has no brace alternation, so the five affected files cannot
# be enumerated in one pattern. These are therefore scoped to *.jsx across the
# frontend, which is broader than ideal: a genuinely inaccessible element in a
# NEW component would also be silenced.
#
# If you would rather keep the rules live for new components, delete e6-e9 and
# instead mark the 18 findings "Accepted" in the SonarQube UI. Accepted issues
# are excluded from the New Issues quality-gate condition, so that also clears
# the gate, per-issue, without weakening the rule anywhere else. That is the
# more surgical option; this one is the lower-maintenance one.
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S1082
sonar.issue.ignore.multicriteria.e6.resourceKey=frontend/src/**/*.jsx
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S6847
sonar.issue.ignore.multicriteria.e7.resourceKey=frontend/src/**/*.jsx
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S6848
sonar.issue.ignore.multicriteria.e8.resourceKey=frontend/src/**/*.jsx
sonar.issue.ignore.multicriteria.e9.ruleKey=javascript:S6819
sonar.issue.ignore.multicriteria.e9.resourceKey=frontend/src/**/*.jsx

# ─────────────────────────────────────────────────────────────────────────────
# COVERAGE
#
# Generate the report before scanning:
#   pytest tests/ --cov=app --cov-report=xml:coverage.xml
#
# Without this the Python suite is invisible to SonarQube and every new line
# reports as uncovered, which fails the coverage condition on any change of
# reasonable size regardless of how well tested it actually is.
# ─────────────────────────────────────────────────────────────────────────────
sonar.python.coverage.reportPaths=coverage.xml

# The frontend has NO test framework and no test files — vitest/jest are not
# installed and package.json has no test script. Every frontend line therefore
# reports 0% forever, which drags new-code coverage below any threshold the
# moment a change touches a .jsx file. Excluding it from the coverage metric
# reflects reality rather than hiding a regression: there is no coverage to
# lose. Remove this line the day a frontend test runner is added — that is the
# real fix, and this exclusion is the honest placeholder until then.
sonar.coverage.exclusions=frontend/**,**/__init__.py

# ─────────────────────────────────────────────────────────────────────────────
# Coverage/duplication exclusions — generated and vendored output only.
# ─────────────────────────────────────────────────────────────────────────────
sonar.exclusions=frontend/dist/**,frontend/node_modules/**,**/__pycache__/**,**/*.min.js
