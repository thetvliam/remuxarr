[pytest]
# Before this file existed there was no pytest configuration at all, which had
# two consequences worth recording:
#
#  • Every test module opened with
#        sys.path.insert(0, os.path.join(os.path.dirname(__file__), ".."))
#    to make `import app...` work — 19 copies of the same line, each of which
#    had to be remembered when adding a file. `pythonpath` below does it once.
#
#  • rootdir was inferred, so `pytest` from a subdirectory collected a
#    different set of tests than `pytest` from the repo root. `testpaths`
#    makes a bare `pytest` mean the same thing everywhere, including in CI.

testpaths = tests
pythonpath = .

# -ra surfaces the reason for skips and xfails in the short summary. What
# earned it: test_timestamp_roundtrip used to guard its offset checks with a
# skip on a UTC host, and since the shipped container and the CI runner are
# both UTC, the file was inert in exactly the two environments that matter —
# with the skip line as the only hint. That guard is now the non_utc_host
# fixture, which forces a non-UTC zone instead of skipping, so the file no
# longer skips there and -ra is not what protects it; an assertion on the
# resulting offset is. Its one remaining skip is platform-gated on
# time.tzset(), which Windows lacks. -ra stays because the failure mode it
# was added for is a property of skips generally, not of that one file.
addopts = -ra

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Deprecation warnings stay visible rather than being filtered. The utcnow()
# migration was prompted by exactly these, and hiding them would remove the
# signal for the next one.
#
# The `error:` lines below are the opposite of filtering: each names a warning
# that WAS permanent in this suite and has since been fixed at the source, and
# pins it at zero so it cannot drift back unnoticed. They are listed
# individually rather than as a blanket `error` because a blanket rule would
# turn the next genuinely new warning into a hard failure on an unrelated PR,
# which is how a suite ends up with `default` restored and all three of these
# back. Each entry needs the fix described beside it, not a suppression:
#
#  • class-based `Config`  → app/config.py uses SettingsConfigDict. Left as a
#    warning it becomes silence in Pydantic v3, where an unread `class Config`
#    means env_prefix is simply not applied and every REMUXARR_* override
#    stops working with no error at all.
#  • starlette/httpx       → tests/requirements-test.txt installs httpx2, the
#    backend starlette.testclient actually asks for.
#  • un-awaited coroutine  → a test double in test_revert_routes.py dropped
#    the coroutine it was handed instead of closing it. This one needs BOTH
#    of the last two lines, which is not obvious: the warning is emitted as
#    a plain RuntimeWarning, but it fires during garbage collection, and an
#    exception raised there cannot propagate to the test that triggered the
#    collection. Python hands it to the unraisable hook instead, which
#    pytest re-emits as PytestUnraisableExceptionWarning — still only a
#    warning. With the RuntimeWarning line alone the run stays green and
#    merely reports the unraisable; the second line is what turns it into a
#    failure. Verified by mutation both ways round.
filterwarnings =
    default
    error:Support for class-based `config` is deprecated:DeprecationWarning
    error:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    error:coroutine .* was never awaited:RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
